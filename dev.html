       Its own app, deliberately NOT the SPEEKSNET page shell: Nick, 2026-11-19 —

       need to be perfectly speeksnet themed since this will be just the developer
       suite. Only 2 people using it." So: dark, sage-accented, full screen, and

       session to index.html, and the dev-tickets function refuses anyone without
       the dev-tracker Feature Access switch. The way in is the green </> button
       in every other page's header.

       (CLAUDE.md lists this page with the others). -->
