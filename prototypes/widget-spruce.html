<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget Spruce-Ups</title>
<!-- Ethan, 2026-10-29: "review some other of the new widgets you made today both
     full size and mini and see if you want to spruce them up". The ones still
     drawn the same way as each other: Google Reviews and Lost Deals by Store
     (a bar a store), the store Buying and Lost Deals cards (lines of text), and
     the four district two-row minis (all a bar a store). One new look each,
     drawn with the site's styles.css and the real card / shelf markup at ½ row
     (652px) and the ⅓ shelf (428px). Test-login sample figures. Not linked. -->
<link rel="stylesheet" href="../styles.css?v=20261029t">
<style>
  html, body { height: auto !important; overflow: auto !important; }
  body { background: #f4f6f8; display: block !important; }
  .main-content { padding: 20px 24px 60px !important; height: auto !important; overflow: visible !important; max-width: 1400px; }
  .pv-lab { font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: #1a1c1e; margin: 26px 0 4px; }
  .pv-why { font-size: 12px; font-weight: 600; color: #647082; margin: 0 0 10px; }
  .pv-row { display: flex; gap: 20px; align-items: flex-start; }
  .pv-col { flex: 0 0 calc(50% - 10px); }
  .pv-col3 { flex: 0 0 428px; }
  .pv-opt { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #8a94a3; margin: 0 0 6px 4px; }
  .qp-widget { height: 350px; box-sizing: border-box; }
  .qp-widget .sam-board, .qp-widget .sam-card { height: 100%; }
  .qp-mshelf { height: 350px; }
  .qp-ai-body > * { flex: none; }

  /* Reviews by Store: store cards with a trend line */
  .y-rv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 4px; }
  .y-rv > div { border: 1px solid #e6ebf1; border-radius: 12px; padding: 10px 8px 8px; text-align: center; }
  .y-rv .s { font-size: 11px; font-weight: 800; color: #647082; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .y-rv .v { font-size: 24px; font-weight: 900; color: #1a1c1e; margin: 2px 0 0; }
  .y-rv .st { font-size: 11px; font-weight: 800; color: #b7791f; }
  .y-rv svg { display: block; width: 100%; height: 28px; margin-top: 6px; }
  .y-rv .first { border-color: #f3d68a; background: #fffaf0; }
  /* Lost Deals by Store: donut + legend */
  .y-dn { display: flex; align-items: center; gap: 22px; margin-top: 6px; }
  .y-dn svg { width: 150px; height: 150px; flex: none; }
  .y-dn .lg { flex: 1; min-width: 0; }
  .y-dn .lg div { display: grid; grid-template-columns: 14px 44px 1fr auto; align-items: center; gap: 6px; padding: 5px 0; border-top: 1px solid #eef1f4; font-size: 12px; font-weight: 700; color: #3c4654; }
  .y-dn .lg div:first-child { border-top: 0; }
  .y-dn .lg i { width: 10px; height: 10px; border-radius: 3px; }
  .y-dn .lg b { font-weight: 900; color: #1a1c1e; }
  .y-dn .tag { font-size: 10px; font-weight: 800; border-radius: 6px; padding: 1px 6px; }
  .good-t { background: #e8f7ee; color: #146c3c; } .warn-t { background: #fdf3e2; color: #a46412; } .bad-t { background: #fdecec; color: #c53030; }
  /* Store Buying: a week of columns */
  .y-cols { display: flex; align-items: flex-end; gap: 10px; height: 150px; margin: 8px 4px 0; border-bottom: 1px solid #e6ebf1; }
  .y-cols > div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .y-cols .m { font-size: 10px; font-weight: 800; color: #647082; margin-bottom: 3px; }
  .y-cols i { display: block; width: 100%; max-width: 46px; border-radius: 7px 7px 2px 2px; background: #c9d9f2; }
  .y-cols .on i { background: #2563b8; } .y-cols .on .m { color: #2563b8; }
  .y-dx { display: flex; gap: 10px; margin: 5px 4px 0; }
  .y-dx span { flex: 1; text-align: center; font-size: 10.5px; font-weight: 800; color: #8a94a3; }
  .y-dx span.on { color: #1a1c1e; }
  /* Store Lost Deals: three stat boxes + a week of red days */
  .y-box3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 10px; }
  .y-box3 div { background: #f6f8fa; border-radius: 10px; padding: 8px 10px; }
  .y-box3 b { display: block; font-size: 20px; font-weight: 900; color: #1a1c1e; }
  .y-box3 span { font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: #8a94a3; }
  .y-days { display: flex; align-items: flex-end; gap: 6px; height: 70px; }
  .y-days div { flex: 1; text-align: center; }
  .y-days i { display: block; border-radius: 5px 5px 2px 2px; background: #f3b7b7; }
  .y-days .on i { background: #e05252; }
  .y-days span { display: block; font-size: 10px; font-weight: 800; color: #8a94a3; margin-top: 3px; }
  /* minis */
  .y-chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .y-chips div { border-radius: 10px; background: #fdf6e8; text-align: center; padding: 6px 2px; }
  .y-chips b { display: block; font-size: 16px; font-weight: 900; color: #1a1c1e; }
  .y-chips span { font-size: 10px; font-weight: 800; color: #a46412; }
  .y-cash { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .y-cash div { border-radius: 10px; border: 1px solid #e6ebf1; padding: 6px 4px; text-align: center; }
  .y-cash div.low { border-color: #f3c4c4; background: #fdf3f3; }
  .y-cash b { display: block; font-size: 13.5px; font-weight: 900; color: #1a1c1e; }
  .y-cash span { font-size: 10px; font-weight: 800; color: #647082; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .y-mcols { display: flex; align-items: flex-end; gap: 8px; height: 82px; }
  .y-mcols div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .y-mcols b { font-size: 10.5px; font-weight: 900; color: #1a1c1e; margin-bottom: 2px; }
  .y-mcols i { display: block; width: 100%; border-radius: 5px 5px 1px 1px; }
  .y-mcols span { font-size: 10px; font-weight: 800; color: #8a94a3; margin-top: 2px; }
  .y-strip { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 2px; margin: 4px 0 8px; }
  .y-leg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; font-size: 11.5px; font-weight: 700; color: #3c4654; }
  .y-leg span { display: flex; align-items: center; gap: 6px; } .y-leg b { margin-left: auto; font-weight: 900; }
  .y-leg i { width: 8px; height: 8px; border-radius: 3px; }
</style>
</head>
<body class="is-authenticated">
<main class="main-content" id="pv"></main>
<script>
const C = { OVL: '#7c6fd6', LEE: '#4e90cf', WSP: '#2ea36a', MPL: '#d99f43', BAL: '#d9776a' };
const dot = s => '<i class="qp-dot" style="background:' + C[s] + '"></i>';
const IC = {
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  x: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  cart: '<path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2M9 20h.01M18 20h.01"/>',
  cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  tag: '<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><path d="M7 7h.01"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/>',
};
const ico = (k, t) => '<span class="sam-mico qp-cw-ico ' + t + '" aria-hidden="true"><svg viewBox="0 0 24 24">' + IC[k] + '</svg></span>';
const card = (icon, tone, eyebrow, title, top, body) => '<section class="speeks-action-menu qp-part qp-widget"><div class="sam-board"><div class="sam-card"><div class="qp-ai">'
  + '<div class="qp-ai-head">' + ico(icon, tone) + '<div><div class="ew-eyebrow">' + eyebrow + '</div><div class="qp-ai-title">' + title + '</div></div></div>'
  + '<div class="qp-ai-body">' + top + body + '</div></div></div></div></section>';
const mini2 = (icon, tone, k, v, body) => '<div class="qp-mn x2"><div class="qp-mn-head">' + ico(icon, tone) + '<div class="qp-mn-b"><div class="qp-mn-k">' + k + '</div><div class="qp-mn-v">' + v + '</div></div></div>' + body + '</div>';
const shelf = m => '<div class="qp-mshelf">' + m + '<div class="qp-mn-empty"></div></div>';
const spark = (vals, color) => { const W = 100, H = 28, mx = Math.max(...vals), mn = Math.min(...vals);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><polyline points="' + vals.map((v, i) => (i * W / (vals.length - 1)).toFixed(1) + ',' + (H - 3 - (v - mn) / ((mx - mn) || 1) * (H - 6)).toFixed(1)).join(' ') + '" fill="none" stroke="' + color + '" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>'; };
const col = (label, why, a) => '<div class="pv-lab">' + label + '</div><div class="pv-why">' + why + '</div>' + a;

// 1. Google Reviews by Store
const RV = [['BAL', 56, 36, [2, 3, 4, 2, 5, 3, 4, 6, 3, 4, 5, 4, 5, 6]], ['OVL', 53, 30, [3, 2, 4, 3, 3, 4, 2, 5, 4, 3, 4, 5, 3, 4]], ['WSP', 52, 28, [1, 3, 2, 4, 3, 2, 4, 3, 5, 4, 3, 2, 4, 5]], ['MPL', 51, 37, [4, 3, 3, 2, 4, 5, 3, 2, 3, 4, 3, 4, 2, 3]], ['LEE', 46, 30, [2, 2, 3, 1, 2, 3, 4, 2, 3, 2, 3, 4, 3, 2]]];
const rv = card('star', 'a', 'District · This Month', 'Google Reviews by Store',
  '<div class="qp-ai-top"><div class="qp-hl-big">258<small>reviews across 5 stores</small></div><span class="qp-trend up">▲ 23 vs Last Month</span></div>',
  '<div class="qp-hl-cap">Reviews This Month · Five-Star · Reviews a Day</div><div class="y-rv">' + RV.map((x, i) => '<div class="' + (i ? '' : 'first') + '"><div class="s">' + dot(x[0]) + x[0] + '</div><div class="v">' + x[1] + '</div><div class="st">★ ' + x[2] + '</div>' + spark(x[3], C[x[0]]) + '</div>').join('') + '</div>');

// 2. Lost Deals by Store
const LD = [['MPL', 31500, 22], ['WSP', 26300, 16], ['OVL', 25100, 18], ['LEE', 24400, 9], ['BAL', 21000, 13]];
const tot = LD.reduce((a, x) => a + x[1], 0);
let acc = 0; const R = 60, CC = 2 * Math.PI * R;
const donut = '<svg viewBox="0 0 150 150"><g transform="rotate(-90 75 75)">' + LD.map(x => { const len = x[1] / tot * CC, s = '<circle cx="75" cy="75" r="' + R + '" fill="none" stroke="' + C[x[0]] + '" stroke-width="22" stroke-dasharray="' + (len - 2).toFixed(1) + ' ' + CC.toFixed(1) + '" stroke-dashoffset="' + (-acc).toFixed(1) + '"/>'; acc += len; return s; }).join('') + '</g>'
  + '<text x="75" y="72" text-anchor="middle" font-size="20" font-weight="900" fill="#e05252">$128k</text><text x="75" y="90" text-anchor="middle" font-size="10" font-weight="800" fill="#8a94a3">WALKED OUT</text></svg>';
const nt = p => p >= 15 ? 'bad-t' : p >= 10 ? 'warn-t' : 'good-t';
const ld = card('x', 'r', 'District · This Month', 'Lost Deals by Store',
  '<div class="qp-ai-top"><div class="qp-hl-big"><span class="bad">$128,340</span><small>walked out · 608 failed deals</small></div></div>',
  '<div class="y-dn">' + donut + '<div class="lg"><div style="font-size:9.5px;font-weight:800;letter-spacing:.05em;color:#8a94a3;padding-top:0"><span></span><span>STORE</span><span>LOST</span><span>NO DEAL</span></div>'
  + LD.map(x => '<div><i style="background:' + C[x[0]] + '"></i><b>' + x[0] + '</b><span>$' + (x[1] / 1000).toFixed(1) + 'k · ' + Math.round(x[1] / tot * 100) + '%</span><span class="tag ' + nt(x[2]) + '">' + x[2] + '%</span></div>').join('') + '</div></div>');

// 3. Store Buying
const BY = [['Thu', 5.2, 44], ['Fri', 6.1, 43], ['Sat', 7.3, 46], ['Mon', 4.8, 41], ['Tue', 6.6, 45], ['Wed', 9.2, 46]];
const mxb = Math.max(...BY.map(x => x[1]));
const by = card('cart', 'b', 'OVL · Wed, Oct 28', 'Buying',
  '<div class="qp-ai-top"><div class="qp-hl-big">$9,151<small>bought · $4,986 paid</small></div><span class="qp-trend up">▲ $2,508 vs Same Day Avg</span></div>',
  '<div class="qp-hl-cap">Bought a Day · Last 6 Reports · Margin on Top</div><div class="y-cols">' + BY.map((x, i) => '<div class="' + (i === BY.length - 1 ? 'on' : '') + '"><span class="m">' + x[2] + '%</span><i style="height:' + Math.round(x[1] / mxb * 118) + 'px"></i></div>').join('') + '</div>'
  + '<div class="y-dx">' + BY.map((x, i) => '<span class="' + (i === BY.length - 1 ? 'on' : '') + '">' + x[0] + '<br>$' + x[1].toFixed(1) + 'k</span>').join('') + '</div>');

// 4. Store Lost Deals
const LS = [['Thu', 1.2], ['Fri', 0.8], ['Sat', 2.1], ['Mon', 0.6], ['Tue', 1.4], ['Wed', 1.6]];
const mxl = Math.max(...LS.map(x => x[1]));
const ls = card('x', 'r', 'OVL · This Month', 'Lost Deals',
  '<div class="qp-ai-top"><div class="qp-hl-big"><span class="bad">$25,140</span><small>walked out</small></div><span class="qp-trend up">▼ $6,098 vs Last Month</span></div>',
  '<div class="y-box3"><div><b>126</b><span>Failed Deals</span></div><div><b>92</b><span>Devices Lost</span></div><div><b>18%</b><span>Left With No Deal</span></div></div>'
  + '<div class="qp-hl-cap">Lost a Day · Last 6 Reports</div><div class="y-days">' + LS.map((x, i) => '<div class="' + (i === LS.length - 1 ? 'on' : '') + '"><i style="height:' + Math.round(x[1] / mxl * 50) + 'px"></i><span>' + x[0] + ' · $' + x[1].toFixed(1) + 'k</span></div>').join('') + '</div>');

// minis
const m1 = mini2('star', 'a', 'Five-Star · This Month', '161<small>across 5 stores</small>',
  '<div class="y-chips">' + [['MPL', 37], ['BAL', 36], ['OVL', 30], ['LEE', 30], ['WSP', 28]].map(x => '<div><b>' + x[1] + '</b><span>★ ' + x[0] + '</span></div>').join('') + '</div><div class="qp-mn-s">Most at MPL · 9 more than last month</div>');
const m2 = mini2('cash', 'g', 'Cash in Stores · Wed', '$30.1k<small>5 stores</small>',
  '<div class="y-cash">' + [['BAL', '$7.6k'], ['OVL', '$7.1k'], ['MPL', '$6.1k'], ['WSP', '$6.1k'], ['LEE', '$3.2k', 1]].map(x => '<div class="' + (x[2] ? 'low' : '') + '"><b>' + x[1] + '</b><span>' + dot(x[0]) + x[0] + '</span></div>').join('') + '</div><div class="qp-mn-s">Lowest: LEE, half of the average</div>');
const LV = [['MPL', 686], ['WSP', 519], ['LEE', 472], ['OVL', 399], ['BAL', 335]];
const m3 = mini2('tag', 'g', 'Live Listings · District', '2,411<small>live · 142 listed Wed</small>',
  '<div class="y-mcols">' + LV.map(x => '<div><b>' + x[1] + '</b><i style="height:' + Math.round(x[1] / 686 * 52) + 'px;background:' + C[x[0]] + '"></i><span>' + x[0] + '</span></div>').join('') + '</div>');
const AV = [['MPL', 49.0], ['WSP', 37.6], ['OVL', 36.6], ['BAL', 33.2], ['LEE', 17.6]];
const m4 = mini2('layers', 't', 'Available Inventory', '$173.9k<small>at cost · latest report</small>',
  '<div class="y-strip">' + AV.map(x => '<i style="flex:' + x[1] + ';background:' + C[x[0]] + '"></i>').join('') + '</div><div class="y-leg">' + AV.map(x => '<span><i style="background:' + C[x[0]] + '"></i>' + x[0] + '<b>$' + x[1].toFixed(1) + 'k</b></span>').join('') + '</div>');

document.getElementById('pv').innerHTML =
  '<div class="pv-row"><div class="pv-col">' + col('Google Reviews by Store', 'Now a bar a store. → A card a store: count, five-star, and its own reviews-a-day line; the leader in gold.', rv) + '</div>'
  + '<div class="pv-col">' + col('Lost Deals by Store', 'Now a bar a store. → A donut of where the lost money is, with each store\'s share and its no-deal % beside it.', ld) + '</div></div>'
  + '<div class="pv-row"><div class="pv-col">' + col('Buying (store)', 'Now five lines of text. → A column a day, margin on top, today in full blue.', by) + '</div>'
  + '<div class="pv-col">' + col('Lost Deals (store)', 'Now three chip lines. → Three stat boxes and a red column a day.', ls) + '</div></div>'
  + '<div class="pv-lab">District Two-Row Minis</div><div class="pv-why">All four are a bar a store today, so a shelf of them looks the same. Each its own look:</div>'
  + '<div class="pv-row"><div class="pv-col3"><div class="pv-opt">Five-Star · Star Chips</div>' + shelf(m1) + '</div><div class="pv-col3"><div class="pv-opt">Cash in Stores · Store Tiles, Lowest in Red</div>' + shelf(m2) + '</div></div>'
  + '<div class="pv-row" style="margin-top:20px"><div class="pv-col3"><div class="pv-opt">Live Listings · Columns</div>' + shelf(m3) + '</div><div class="pv-col3"><div class="pv-opt">Available Inventory · Share Strip</div>' + shelf(m4) + '</div></div>';
</script>
</body>
</html>
