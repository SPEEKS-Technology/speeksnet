<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEEKSNET | Test Login</title>
<!--
  LOCAL TEST LOGIN — signs this tab in as a test user without a users row.

  Why no real account (Ethan, 2026-10-21): a users row with role manager at OVL
  is read by store-targets (it would raise OVL's listing capacity), kpi-manage
  (OVL's roster), usage-report (a person absent every day) and notify (manager
  nudges). A test login has to be invisible to all of that, so it lives only in
  this tab's sessionStorage — the same keys checkPIN() writes, plus
  speeksTestSession, which makes speeks.js refuse every write (see TEST SESSION
  near the top of speeks.js). Reads are live: it is the real QuickPortal.

  Works on localhost only. On speeksnet.com this page does nothing, and even if
  it did it would only write the visitor's own sessionStorage, which anyone can
  already do from the console.
-->
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f4f7f9; color: #1a1c1e; font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif; }
  .box { background: #fff; border: 1px solid #e3e8ee; border-radius: 14px; padding: 28px; width: min(420px, calc(100vw - 32px));
         box-sizing: border-box; box-shadow: 0 1px 2px rgba(16,24,40,.06); }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p { margin: 0 0 18px; font-size: 14px; color: #647082; line-height: 1.5; }
  button { font: inherit; font-size: 14px; font-weight: 600; width: 100%; min-height: 44px; border-radius: 10px; cursor: pointer;
           border: 1px solid #1f9d57; background: #1f9d57; color: #fff; margin-bottom: 10px; }
  button:hover { background: #178048; }
  button.plain { background: #fff; color: #1a1c1e; border-color: #d5dce4; }
  button.plain:hover { background: #f1f4f7; }
  .warn { color: #b42318; font-weight: 600; }
</style>
</head>
<body>
<div class="box" id="box">
  <h1>Test login</h1>
  <p>Opens the real QuickPortal as a test user. Live data is read; nothing can be saved.</p>
  <button type="button" onclick="signIn('Test Manager OVL', 'manager', 'OVL')">Sign in as OVL Manager (test)</button>
  <button type="button" class="plain" onclick="signOut()">Sign out of the test session</button>
</div>
<script>
  var LOCAL = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1;
  if (!LOCAL) {
    document.getElementById('box').innerHTML = '<h1>Test login</h1><p class="warn">Only available on a local server.</p>';
  }
  function signIn(name, role, store) {
    if (!LOCAL) return;
    sessionStorage.clear();
    sessionStorage.setItem('speeksTestSession', '1');
    sessionStorage.setItem('speeksUnlocked', 'true');
    sessionStorage.setItem('speeksUserName', name);
    sessionStorage.setItem('speeksUserRole', role);
    sessionStorage.setItem('speeksUserStore', store);
    sessionStorage.setItem('speeksUserPin', '');
    sessionStorage.setItem('speeksUserOnboardedAt', '');
    // A copy for speeks.js to restore from when the Claude browser pane re-opens
    // the tab with an empty sessionStorage (TEST SESSION, top of speeks.js).
    var keep = {};
    for (var i = 0; i < sessionStorage.length; i++) {
      var k = sessionStorage.key(i);
      keep[k] = sessionStorage.getItem(k);
    }
    localStorage.setItem('speeksTestRestore', JSON.stringify(keep));
    location.href = '../index.html';
  }
  function signOut() {
    sessionStorage.clear();
    localStorage.removeItem('speeksTestRestore');
    location.href = '../index.html';
  }
</script>
</body>
</html>
